<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vikramsinh Shinde | DevOps Engineer + Software Engineer</title>
<meta name="description" content="DevOps Engineer + Software Engineer at IDBI Bank (iKaushal Department). AWS, Kubernetes, CI/CD, Python/Flask, React.js and ML deployment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060913;--ink:#e9edf7;--mut:#8f9bb3;--a:#818cf8;--b:#22d3ee;--ok:#4ade80;--glass:rgba(255,255,255,.055);--bd:rgba(255,255,255,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:50vmax;height:50vmax;border-radius:50%;filter:blur(120px);opacity:.33}
body::before{background:#4338ca;top:-18vmax;left:-14vmax}
body::after{background:#0e7490;bottom:-20vmax;right:-16vmax}
.mono,.st,.log,.dt,.bdg,.tech,.k{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
a{color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 24px);overflow-x:auto}
nav a{color:var(--mut);text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:.2s}
nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
#hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 60px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
h1{font-size:clamp(2.6rem,6.4vw,4.8rem);line-height:1.02;font-weight:700;letter-spacing:-.035em;margin-bottom:16px}
.role{font-size:clamp(1.1rem,2.2vw,1.45rem);font-weight:500;color:var(--b)}
.where{color:var(--mut);margin:4px 0 18px}
.sub{color:#b4bdd0;max-width:540px;margin-bottom:28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{padding:12px 24px;border-radius:14px;text-decoration:none;font-weight:600;font-size:.95rem;color:#fff;border:1px solid var(--bd);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .25s,box-shadow .25s}
.btn.p{background:linear-gradient(135deg,#6366f1,#06b6d4);border:0}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(99,102,241,.4)}
.run{padding:22px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:.8rem;color:var(--mut)}
.live{color:var(--ok);display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.3}}
.stages{display:flex;flex-direction:column}
.stg{display:flex;align-items:center;gap:14px;position:relative;padding:9px 0}
.stg:not(:last-child)::after{content:"";position:absolute;left:13px;top:38px;bottom:-9px;width:2px;background:rgba(255,255,255,.12)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:2px solid var(--bd);color:transparent;flex:none;animation:pass .5s forwards;animation-delay:calc(var(--i)*.55s + .4s)}
@keyframes pass{to{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,.12);box-shadow:0 0 14px rgba(74,222,128,.45)}}
.st{font-size:.85rem}
.st small{display:block;color:var(--mut);font-size:.72rem}
.log{margin-top:16px;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);font-size:.74rem;color:#9fb0c9;line-height:1.7;overflow-x:auto;white-space:nowrap}
.log b{color:var(--ok);font-weight:500}
.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.mets div{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.mets b{display:block;font-size:1.35rem;line-height:1.2}
.mets span{font-size:.72rem;color:var(--mut)}
.h{margin-bottom:34px}
.k{color:var(--b);font-size:.8rem}
.h h2{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:700;letter-spacing:-.025em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{padding:24px;transition:border-color .3s,transform .3s}
.card:hover{transform:translateY(-4px);border-color:rgba(129,140,248,.55)}
